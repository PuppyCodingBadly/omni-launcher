name: Flatpak

# Builds the flatpak, publishes an OSTree repo and the landing page to the
# gh-pages branch, and attaches the standalone bundle plus the .flatpakref to a
# release. Tag a version (`git tag v0.1.0 && git push --tags`) to run it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The log itself needs a signed-in reader; a check annotation does
            # not, so the failing tests are copied there.
            grep -E '^[0-9]{2}:[0-9]{2} \+[0-9]+ -[0-9]+' test-output.log |
              tail -20 |
              while IFS= read -r line; do
                echo "::error title=Test failure::$line"
              done
          fi
          exit "$status"
      - name: Validate the metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate --no-net flatpak/io.github.PuppyCodingBadly.OmniLauncher.metainfo.xml

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          # The pin below is checked against the tag's history; a shallow
          # checkout does not have it.
          fetch-depth: 0

      # The generated manifest builds a pinned commit of the repo, not this
      # checkout, so a release cut from a tag that does not contain that commit
      # would ship the wrong code. The manifest cannot pin its own commit —
      # amending it to name itself changes the hash it would have to name — so
      # a release is: regenerate the manifest at the code commit, commit that
      # as part of the release, and tag the commit carrying it. The pin then
      # names an ancestor of the tag.
      - name: Check the pinned commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PINNED=$(grep -m1 -E '^[[:space:]]+commit:' io.github.PuppyCodingBadly.OmniLauncher.yml | sed -E 's/.*commit:[[:space:]]*//; s/["'"'"']//g')
          if ! git merge-base --is-ancestor "$PINNED" "${{ github.sha }}"; then
            echo "Manifest pins $PINNED, which is not in this tag's history (${{ github.sha }})."
            echo "Regenerate the manifest at the code commit and tag the commit that carries it:"
            echo "  flatpak-flutter.py flatpak-flutter.yml"
            exit 1
          fi
          if [ "$PINNED" != "${{ github.sha }}" ]; then
            echo "Pinning $PINNED, an ancestor of this tag: the manifest cannot name its own commit."
          fi

      # The store hands out the zips and the index in plugins/, so they have to
      # match the plugin sources they were built from.
      - name: Check the plugin catalogue
        run: plugins/build.sh --check

      - name: Build the flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OmniLauncher-x86_64.flatpak
          manifest-path: io.github.PuppyCodingBadly.OmniLauncher.yml
          runtime-version: '26.08'
          cache-key: flatpak-builder-${{ github.sha }}

      # The bundle above is the standalone file people can download. A
      # .flatpakref needs a repository to point at, so build one and publish it
      # on the Pages site.
      - name: Build the repository
        run: |
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse \
            build-dir io.github.PuppyCodingBadly.OmniLauncher.yml
          flatpak build-update-repo repo

      - name: Write the .flatpakref
        run: |
          cat > io.github.PuppyCodingBadly.OmniLauncher.flatpakref <<EOF
          [Flatpak Ref]
          Title=Omni Launcher
          Name=io.github.PuppyCodingBadly.OmniLauncher
          Branch=master
          Url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          Comment=One window for every game on this machine
          EOF

      - name: Assemble the Pages site
        run: |
          mkdir -p public
          cp -r site/. public/
          cp -r repo public/repo
          cp io.github.PuppyCodingBadly.OmniLauncher.flatpakref public/
          # The page is written with placeholders so it works in any fork.
          sed -i "s|OWNER/REPO|${{ github.repository }}|g" public/index.html

      - name: Publish the Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniLauncher-x86_64.flatpak
            io.github.PuppyCodingBadly.OmniLauncher.flatpakref
          generate_release_notes: true
