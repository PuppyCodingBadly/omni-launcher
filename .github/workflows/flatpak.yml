name: Flatpak

# Builds the flatpak, publishes an OSTree repo and the landing page on GitHub
# Pages, and attaches the standalone bundle plus the .flatpakref to a release.
# Tag a version (`git tag v0.1.0 && git push --tags`) to run it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Deploying the Pages artifact needs both, and the job below is the only
  # thing that publishes; a branch push does not deploy a workflow-sourced site.
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # The flatpak manifest pins this SDK, so tests and releases use the
          # same Flutter instead of whatever stable happens to be current.
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          set +e
          flutter test --coverage --reporter expanded 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The log itself needs a signed-in reader; a check annotation does
            # not, so each failing test and the lines under it are copied there.
            python3 -c "import sys; lines=open('test-output.log',errors='replace').read().splitlines(); starts=[i for i,l in enumerate(lines) if '[E]' in l]; [print('::error title=Test failure::'+'\n'.join(lines[i:i+10]).replace('%','%25').replace('\r','').replace('\n','%0A')) for i in starts[:10]]"
          fi
          exit "$status"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Validate the metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate --no-net flatpak/io.github.PuppyCodingBadly.OmniLauncher.metainfo.xml

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    # deploy-pages refuses to run outside the environment Pages is bound to;
    # the environment's branch policy allows main and gh-pages.
    environment: github-pages
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          # The pin below is checked against the tag's history; a shallow
          # checkout does not have it.
          fetch-depth: 0

      # The generated manifest builds a pinned commit of the repo, not this
      # checkout, so a release cut from a tag that does not contain that commit
      # would ship the wrong code. The manifest cannot pin its own commit —
      # amending it to name itself changes the hash it would have to name — so
      # a release is: regenerate the manifest at the code commit, commit that
      # as part of the release, and tag the commit carrying it. The pin then
      # names an ancestor of the tag.
      - name: Check the pinned commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The workspace is bind-mounted from the runner user while this step
          # runs as root, so git refuses the repository as someone else's.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PINNED=$(grep -m1 -E '^[[:space:]]+commit:' io.github.PuppyCodingBadly.OmniLauncher.yml | sed -E 's/.*commit:[[:space:]]*//; s/["'"'"']//g')
          # `github.sha` is not the commit for every tag shape (an annotated
          # tag has an object of its own), so the checked-out tag decides.
          TARGET=$(git rev-parse 'HEAD^{commit}')
          if ! git merge-base --is-ancestor "$PINNED" "$TARGET"; then
            echo "::error title=Pin check::pinned=$PINNED target=$TARGET pinned-type=$(git cat-file -t "$PINNED" 2>&1) shallow=$(git rev-parse --is-shallow-repository 2>&1)"
            echo "Manifest pins $PINNED, which is not in this tag's history ($TARGET)."
            echo "Regenerate the manifest at the code commit and tag the commit that carries it:"
            echo "  flatpak-flutter.py flatpak-flutter.yml"
            exit 1
          fi
          if [ "$PINNED" != "$TARGET" ]; then
            echo "Pinning $PINNED, an ancestor of this tag: the manifest cannot name its own commit."
          fi

      # The store hands out the zips and the index in plugins/, so they have to
      # match the plugin sources they were built from.
      - name: Check the plugin catalogue
        run: plugins/build.sh --check

      # The release repository is signed: clients refuse an unsigned summary
      # once their remote has the public key. The private key lives only in
      # this repository's FLATPAK_GPG_PRIVATE_KEY secret; the public key is
      # flatpak/io.github.PuppyCodingBadly.OmniLauncher.gpg.
      - name: Import the signing key
        id: signing
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error title=Missing signing key::Set the FLATPAK_GPG_PRIVATE_KEY secret to the armored private key."
            exit 1
          fi
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          export GNUPGHOME
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          PUB=$(gpg --batch --show-keys --with-colons flatpak/io.github.PuppyCodingBadly.OmniLauncher.gpg | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$FPR" ] || [ "$PUB" != "$FPR" ]; then
            echo "::error title=Signing key mismatch::The secret's key is '$FPR'; the committed public key is '$PUB'."
            exit 1
          fi
          echo "fingerprint=$FPR" >> "$GITHUB_OUTPUT"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_HOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build the flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OmniLauncher-x86_64.flatpak
          manifest-path: io.github.PuppyCodingBadly.OmniLauncher.yml
          runtime-version: '26.08'
          cache-key: flatpak-builder-${{ github.sha }}
          # Signs the app commit as it is exported; the summary is signed below.
          gpg-sign: ${{ steps.signing.outputs.fingerprint }}

      # The bundle above is the standalone file people can download. A
      # .flatpakref needs a repository to point at, so build and sign one and
      # publish it on the Pages site.
      - name: Build and sign the repository
        env:
          FLATPAK_GPG_KEY: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -eu
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse \
            --gpg-sign="$FLATPAK_GPG_KEY" \
            build-dir io.github.PuppyCodingBadly.OmniLauncher.yml
          # The app commit is signed by flatpak-builder. This first pass creates
          # the appstream branches and signs the summary that names them.
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY" \
            --gpg-homedir="$FLATPAK_GPG_HOME" --generate-static-deltas repo
          # build-update-repo only signs the summary, so appstream commits are
          # signed through a temporary app ref and the summary is written again
          # with the signed objects, exactly as flatpak's own documentation
          # describes.
          for ref in appstream/x86_64 appstream2/x86_64; do
            [ -f "repo/refs/heads/$ref" ] || continue
            commit=$(cat "repo/refs/heads/$ref")
            ostree --repo=repo refs \
              --create=app/io.github.PuppyCodingBadly.OmniLauncher.Temp/x86_64/master \
              --force "$commit"
            flatpak build-sign --gpg-sign="$FLATPAK_GPG_KEY" \
              --gpg-homedir="$FLATPAK_GPG_HOME" --arch=x86_64 \
              repo io.github.PuppyCodingBadly.OmniLauncher.Temp master
            ostree --repo=repo refs \
              --delete app/io.github.PuppyCodingBadly.OmniLauncher.Temp/x86_64/master
          done
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY" \
            --gpg-homedir="$FLATPAK_GPG_HOME" --no-update-appstream \
            --generate-static-deltas repo

      - name: Write the .flatpakref and .flatpakrepo
        run: |
          GPG_KEY=$(base64 -w0 flatpak/io.github.PuppyCodingBadly.OmniLauncher.gpg)
          cat > io.github.PuppyCodingBadly.OmniLauncher.flatpakref <<EOF
          [Flatpak Ref]
          Title=Omni Launcher
          Name=io.github.PuppyCodingBadly.OmniLauncher
          Branch=master
          Url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          Comment=One window for every game on this machine
          GPGKey=$GPG_KEY
          EOF
          cat > io.github.PuppyCodingBadly.OmniLauncher.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Omni Launcher
          Url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          Homepage=https://github.com/${{ github.repository }}
          Comment=One window for every game on this machine
          Description=Omni Launcher builds and updates
          GPGKey=$GPG_KEY
          EOF

      - name: Assemble the Pages site
        run: |
          mkdir -p public
          cp -r site/. public/
          cp -r repo public/repo
          cp io.github.PuppyCodingBadly.OmniLauncher.flatpakref public/
          cp io.github.PuppyCodingBadly.OmniLauncher.flatpakrepo public/
          cp flatpak/io.github.PuppyCodingBadly.OmniLauncher.gpg public/
          # The page is written with placeholders so it works in any fork.
          sed -i "s|OWNER/REPO|${{ github.repository }}|g" public/index.html

      # The site is deployed from this run's artifact. The page used to be
      # pushed to a gh-pages branch, which does not deploy a Pages site whose
      # source is "GitHub Actions" — that left the published repo at whatever
      # was last built by hand.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Release
        # A manual dispatch builds and publishes the site without a release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniLauncher-x86_64.flatpak
            io.github.PuppyCodingBadly.OmniLauncher.flatpakref
            io.github.PuppyCodingBadly.OmniLauncher.flatpakrepo
            flatpak/io.github.PuppyCodingBadly.OmniLauncher.gpg
          generate_release_notes: true
